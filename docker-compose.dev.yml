version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Dev : MySQL uniquement — Laravel tourne en local (php artisan serve)
# ─────────────────────────────────────────────────────────────────────────────

services:
  db:
    image: mysql:8.0
    container_name: ft_db_dev
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: financetracker
      MYSQL_USER: ft_user
      MYSQL_PASSWORD: secret
    volumes:
      - ft_dev_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ft_dev_db:
